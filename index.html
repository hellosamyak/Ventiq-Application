<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ventiq — a single home for your videos, tweets, and community. Create, publish, and connect." />
    <meta name="theme-color" content="#0b0e13" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ventiq_theme')
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          root.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1420' : '#f6f7f9')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Ventiq | Create. Publish. Connect.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
